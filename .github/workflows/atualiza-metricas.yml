name: Atualiza métricas do README

on:
  # Atualiza quando há novos commits na branch principal.
  push:
    branches:
      - main

  # Atualiza quando um novo Pull Request é criado.
  pull_request:
    branches:
      - main
    types:
      - opened

  # Verificação mensal, todo dia 1, às 06:00 UTC.
  schedule:
    - cron: "0 6 1 * *"

  # Permite execução manual.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: atualiza-metricas-readme
  cancel-in-progress: false

jobs:
  atualiza-metricas:
    name: Atualiza commits e Pull Requests
    runs-on: ubuntu-latest
    steps:
      - name: Consulta o GitHub e atualiza o README
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const branch = repository.default_branch;

            // Conta todos os commits alcançáveis pela branch padrão.
            // A paginação busca todas as páginas, não apenas os primeiros 100.
            const todosCommits = await github.paginate(
              github.rest.repos.listCommits,
              { owner, repo, sha: branch, per_page: 100 }
            );

            // O commit criado por esta rotina não entra na própria contagem.
            const mensagemCommitAutomatico = "Atualiza métricas automáticas do README";
            const totalCommits = todosCommits.filter(
              ({ commit }) => !commit.message.startsWith(mensagemCommitAutomatico)
            ).length;

            // Conta Pull Requests abertos e fechados.
            const todosPullRequests = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: "all", per_page: 100 }
            );
            const totalPullRequests = todosPullRequests.length;

            // Lê o README na branch padrão.
            const caminhoReadme = "README.md";
            const { data: arquivoReadme } = await github.rest.repos.getContent({
              owner,
              repo,
              path: caminhoReadme,
              ref: branch
            });

            if (Array.isArray(arquivoReadme) || arquivoReadme.type !== "file") {
              throw new Error(`${caminhoReadme} não foi encontrado como arquivo.`);
            }

            const readmeAtual = Buffer.from(arquivoReadme.content, "base64").toString("utf8");
            const marcadorInicio = "<!-- METRICAS-AUTOMATICAS:INICIO -->";
            const marcadorFim = "<!-- METRICAS-AUTOMATICAS:FIM -->";

            // Exige exatamente um par de marcadores para evitar alterar a seção errada.
            if (
              readmeAtual.split(marcadorInicio).length !== 2 ||
              readmeAtual.split(marcadorFim).length !== 2
            ) {
              throw new Error("Adicione exatamente um par de marcadores de métricas ao README.md.");
            }

            const inicio = readmeAtual.indexOf(marcadorInicio);
            const fim = readmeAtual.indexOf(marcadorFim);

            if (fim <= inicio) {
              throw new Error("Os marcadores de métricas estão fora de ordem no README.md.");
            }

            const linhaMetricas =
              `| **30** | **15** | **8** | **${totalPullRequests}** | **${totalCommits}** | **12** | **~60** |`;
            const blocoNovo = `${marcadorInicio}\n${linhaMetricas}\n${marcadorFim}`;

            const readmeAtualizado =
              readmeAtual.slice(0, inicio) +
              blocoNovo +
              readmeAtual.slice(fim + marcadorFim.length);

            if (readmeAtualizado === readmeAtual) {
              core.info(`README já está atualizado: ${totalCommits} commits e ${totalPullRequests} Pull Requests.`);
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: caminhoReadme,
              message: mensagemCommitAutomatico,
              content: Buffer.from(readmeAtualizado, "utf8").toString("base64"),
              sha: arquivoReadme.sha,
              branch
            });

            core.notice(`Métricas atualizadas: ${totalCommits} commits e ${totalPullRequests} Pull Requests.`);
